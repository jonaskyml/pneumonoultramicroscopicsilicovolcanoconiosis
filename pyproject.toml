version = "0.1.0"
description = "Search for the longest word from lists & dictionaries with various parameters."
authors = [
    {name = "jonas"}
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click (>=8.5.0,<9.0.0)"
]

[project.scripts]
pneu = "pneumonoultramicroscopicsilicovolcanoconiosis:cli"
pneumonoultramicroscopicsilicovolcanoconiosis = "pneumonoultramicroscopicsilicovolcanoconiosis:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"