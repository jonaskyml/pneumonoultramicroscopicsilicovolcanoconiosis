[project]
name = "pneumonoultramicroscopicsilicovolcanoconiosis"
version = "0.1.0"
description = "Search for the longest word from lists & dictionaries with various parameters."
authors = [
    {name = "jonas"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "poetry (>=2.4.3,<3.0.0) ; python_version < '4.0'",
    "click (>=8.5.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pneu = "pneumonoultramicroscopicsilicovolcanoconiosis:cli" # entry point to the CLI
